version: 2
jobs:
  build:
    docker:
      - image: cimg/python:3.14
    steps:
      - checkout
      - run:
          name: Run checks with uv
          command: |
            source .agents/setup
            uv run test/run.py

  # Update the gh-pages branch. This requires that
  # CircleCI be set up with read-write permission
  # on the repo, which is not CircleCI's default.
  deploy:
    docker:
      - image: cimg/python:3.14
    steps:
      - checkout
      - run:
          name: Generate and deploy alternate formats with uv
          command: |
            source .agents/setup
            scripts/update_gh_pages.sh

workflows:
  version: 2
  build-and-deploy:
    jobs:
      - build
      - deploy:
          filters:
            branches:
              only: main
